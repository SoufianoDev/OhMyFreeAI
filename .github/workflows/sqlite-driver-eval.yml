name: SQLite driver evaluation

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - 'migrations/**'
      - 'internal/infrastructure/sqlite/**'
      - 'tests/sqlite-driver-eval/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sqlite-driver-eval.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver-matrix:
    name: ${{ matrix.driver.name }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        driver:
          - name: modernc
            driver_name: sqlite
          - name: ncruces
            driver_name: sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Evaluate driver
        working-directory: tests/sqlite-driver-eval
        env:
          OMFAI_SQLITE_DRIVER: ${{ matrix.driver.driver_name }}
        run: |
          go mod tidy
          go mod verify
          go test -v -count=1 ./...
