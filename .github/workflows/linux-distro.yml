name: Linux distribution compatibility

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - 'desktop-src/**'
      - 'frontend/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - '.github/workflows/linux-distro.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-distro:
    name: ${{ matrix.distro }} / ${{ matrix.stack }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current GTK4 + WebKitGTK 6.0 baseline.
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
            stack: gtk4-webkit6
            build_tags: ""
          - distro: Debian 13
            image: debian:trixie
            family: debian
            stack: gtk4-webkit6
            build_tags: ""
          - distro: Fedora 44
            image: fedora:44
            family: fedora
            stack: gtk4-webkit6
            build_tags: ""
          - distro: Arch Linux rolling
            image: archlinux:latest
            family: arch
            stack: gtk4-webkit6
            build_tags: ""
          - distro: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            family: suse
            stack: gtk4-webkit6
            build_tags: ""
          - distro: Fedora 44 legacy GTK3
            image: fedora:44
            family: fedora
            stack: legacy-gtk3-webkit41
            build_tags: gtk3

          # Wails v3.0.x compatibility lane for WebKit2GTK 4.1 systems.
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
            family: debian
            stack: legacy-gtk3-webkit41
            build_tags: gtk3
          - distro: Debian 12
            image: debian:12
            family: debian
            stack: legacy-gtk3-webkit41
            build_tags: gtk3


    steps:
      - name: Install native desktop build and virtual-display dependencies
        shell: sh
        env:
          DISTRO_FAMILY: ${{ matrix.family }}
          BUILD_STACK: ${{ matrix.stack }}
        run: |
          set -eu
          case "$DISTRO_FAMILY:$BUILD_STACK" in
            debian:gtk4-webkit6)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
                xvfb xauth dbus-x11 libegl1 libgl1-mesa-dri libgbm1 \
                libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                libxrender1 libxtst6 libxi6 libxkbcommon-x11-0 libwayland-client0 \
                libdrm2 curl git ca-certificates
              ;;
            debian:legacy-gtk3-webkit41)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
                xvfb xauth dbus-x11 libegl1-mesa libgl1-mesa-dri libgbm1 \
                libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
                libxrender1 libxtst6 libxi6 libxkbcommon-x11-0 libwayland-client0 \
                libdrm2 curl git ca-certificates
              ;;
            fedora:gtk4-webkit6)
              dnf install -y gcc gcc-c++ pkgconf-pkg-config gtk4-devel webkitgtk6.0-devel \
                xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-libEGL mesa-libGL \
                libX11-xcb libXcomposite libXdamage libXfixes libXrandr libXrender \
                libXtst libXi libxkbcommon-x11 libwayland-client libdrm curl git ca-certificates
              ;;
            fedora:legacy-gtk3-webkit41)
              dnf install -y gcc gcc-c++ pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel \
                xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-libEGL mesa-libGL \
                libX11-xcb libXcomposite libXdamage libXfixes libXrandr libXrender \
                libXtst libXi libxkbcommon-x11 libwayland-client libdrm curl git ca-certificates
              ;;
            arch:gtk4-webkit6)
              pacman -Syu --noconfirm --needed base-devel pkgconf gtk4 webkitgtk-6.0 \
                xorg-server-xvfb xorg-xauth mesa libx11 libxcomposite libxdamage \
                libxfixes libxrandr libxrender libxtst libxi libxkbcommon-x11 \
                wayland libdrm curl git ca-certificates
              ;;
            suse:gtk4-webkit6)
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends \
                bash gcc gcc-c++ pkg-config gtk4-devel webkitgtk4-devel \
                xorg-x11-server-Xvfb xauth Mesa-dri libX11-xcb1 libXcomposite1 \
                libXdamage1 libXfixes3 libXrandr2 libXrender1 libXtst6 libXi6 \
                libxkbcommon-x11-0 libwayland-client0 libdrm2 curl git ca-certificates
              ;;
            *)
              echo "Unsupported distro/build-stack pair: $DISTRO_FAMILY:$BUILD_STACK" >&2
              exit 2
              ;;
          esac
          command -v Xvfb
          pkg-config --modversion gtk4 2>/dev/null || pkg-config --modversion gtk+-3.0

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the actual OhMyFreeAI desktop application
        env:
          WAILS_BUILD_TAGS: ${{ matrix.build_tags }}
        run: python scripts/build_desktop.py --output-dir dist

      - name: Launch twice and verify the live WebView-to-Go bridge
        run: python scripts/smoke_desktop.py dist/OhMyFreeAI
