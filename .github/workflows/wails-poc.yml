name: Wails v3 platform proof

on:
  push:
    branches:
      - "foundation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Wails v3.0.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate and build official starter (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omfai-wails-proof"
          cd "$RUNNER_TEMP/omfai-wails-proof"
          wails3 init -n omfai-wails-poc -t vanilla-js
          cd omfai-wails-poc
          wails3 build
          test -f bin/omfai-wails-poc

      - name: Generate and build official starter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proof = Join-Path $env:RUNNER_TEMP "omfai-wails-proof"
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          Push-Location $proof
          try {
            wails3 init -n omfai-wails-poc -t vanilla-js
            Set-Location (Join-Path $proof "omfai-wails-poc")
            wails3 build
            if (-not (Test-Path "bin/omfai-wails-poc.exe")) {
              throw "Wails build completed without the expected executable."
            }
          }
          finally {
            Pop-Location
          }
