name: Wails v3 platform proof

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - 'desktop-src/**'
      - 'frontend/**'
      - 'scripts/build_desktop.py'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - '.github/workflows/wails-poc.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Wails v3.0.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build native OhMyFreeAI application
        run: python scripts/build_desktop.py

      - name: Verify native executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: test -f dist/OhMyFreeAI

      - name: Smoke-test native WebView bridge and database reopen (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          first_log="$RUNNER_TEMP/ohmyfreeai-webview-smoke.log"
          set +e
          timeout --signal=TERM --kill-after=5s 12s xvfb-run -a ./dist/OhMyFreeAI >"$first_log" 2>&1
          first_status=$?
          set -e
          cat "$first_log"
          if [[ "$first_status" -ne 124 && "$first_status" -ne 0 && "$first_status" -ne 137 ]]; then
            echo "Native application exited unexpectedly: $first_status"
            exit "$first_status"
          fi
          grep -q "native snapshot ready" "$first_log"

          second_log="$RUNNER_TEMP/ohmyfreeai-webview-reopen.log"
          set +e
          timeout --signal=TERM --kill-after=5s 12s xvfb-run -a ./dist/OhMyFreeAI >"$second_log" 2>&1
          second_status=$?
          set -e
          cat "$second_log"
          if [[ "$second_status" -ne 124 && "$second_status" -ne 0 && "$second_status" -ne 137 ]]; then
            echo "Native application failed to reopen after termination: $second_status"
            exit "$second_status"
          fi
          grep -q "native snapshot ready" "$second_log"

          if grep -q "Overriding existing handler for signal 10" "$first_log" "$second_log"; then
            signal_log="$RUNNER_TEMP/ohmyfreeai-webview-signal12.log"
            set +e
            timeout --signal=TERM --kill-after=5s 12s xvfb-run -a env JSC_SIGNAL_FOR_GC=12 ./dist/OhMyFreeAI >"$signal_log" 2>&1
            signal_status=$?
            set -e
            cat "$signal_log"
            if [[ "$signal_status" -ne 124 && "$signal_status" -ne 0 && "$signal_status" -ne 137 ]]; then
              echo "Native application failed with JSC_SIGNAL_FOR_GC=12: $signal_status"
              exit "$signal_status"
            fi
            grep -q "native snapshot ready" "$signal_log"
            if grep -q "Overriding existing handler for signal 10" "$signal_log"; then
              echo "JSC_SIGNAL_FOR_GC=12 did not resolve the JavaScriptCore signal warning."
              exit 1
            fi
            echo "JSC_SIGNAL_FOR_GC=12 resolved the JavaScriptCore signal warning."
          else
            echo "No JavaScriptCore signal 10 warning reproduced."
          fi

      - name: Verify native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OhMyFreeAI.exe")) {
            throw "The native OhMyFreeAI executable was not produced."
          }
