name: Wails v3 platform proof

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - 'desktop-src/**'
      - 'frontend/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/smoke_cli.py'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'migrations/**'
      - '.github/workflows/wails-poc.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Wails v3.0.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb xauth

      - name: Install pinned Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build native OhMyFreeAI application
        run: python scripts/build_desktop.py

      - name: Smoke-test native CLI dispatch (Linux)
        if: runner.os == 'Linux'
        run: python scripts/smoke_cli.py dist/OhMyFreeAI

      - name: Smoke-test native CLI dispatch (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke_cli.py dist/OhMyFreeAI.exe

      - name: Verify native executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: test -f dist/OhMyFreeAI

      - name: Smoke-test native WebView bridge and database reopen (Linux)
        if: runner.os == 'Linux'
        run: python scripts/smoke_desktop.py dist/OhMyFreeAI

      - name: Verify native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OhMyFreeAI.exe")) {
            throw "The native OhMyFreeAI executable was not produced."
          }
