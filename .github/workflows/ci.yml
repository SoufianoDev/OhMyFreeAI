name: OhMyFreeAI CI

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - '**/*.go'
      - '**/*.py'
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'internal/**'
      - 'scripts/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Build Go packages
        run: go build ./...

      - name: Compile Python developer tooling
        run: python -m py_compile scripts/dev.py scripts/build_desktop.py scripts/smoke_cli.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Check architecture boundaries
        run: python scripts/dev.py arch-check
